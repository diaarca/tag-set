name: Setwise
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
packages:
  Setwise:
    path: .
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: 7f75a2299dc329c0b7855afb25d47663a02855cb
targetTemplates:
  SharedApp:
    type: application
    sources: [App]
    dependencies:
      - package: Setwise
        product: SetwiseCore
      - package: YouTubeKit
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
targets:
  Setwise-iOS:
    templates: [SharedApp]
    platform: iOS
    deploymentTarget: '17.0'
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Setwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        SetwiseCloudContainer: ''
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
    entitlements:
      path: Config/Setwise.entitlements
      properties: {}
  Setwise-macOS:
    templates: [SharedApp]
    platform: macOS
    deploymentTarget: '14.0'
    info:
      path: Config/macOS-Info.plist
      properties:
        CFBundleDisplayName: Setwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        SetwiseCloudContainer: ''
    settings:
      base:
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true

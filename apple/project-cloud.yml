include: project.yml
settings:
  base:
    SETWISE_CLOUD_CONTAINER: iCloud.dev.dylan.Setwise
targets:
  Setwise-iOS:
    info:
      properties:
        SetwiseCloudContainer: $(SETWISE_CLOUD_CONTAINER)
    entitlements:
      path: Config/Cloud-iOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          ['$(SETWISE_CLOUD_CONTAINER)']
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Development
  Setwise-macOS:
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
    info:
      properties:
        SetwiseCloudContainer: $(SETWISE_CLOUD_CONTAINER)
    entitlements:
      path: Config/Cloud-macOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          ['$(SETWISE_CLOUD_CONTAINER)']
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Development

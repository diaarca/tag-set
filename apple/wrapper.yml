name: TagSet
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: 7f75a2299dc329c0b7855afb25d47663a02855cb
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  TagSet-iOS:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Wrapper
      - path: ../wrapper/bundle
        type: folder
        buildPhase: resources
    dependencies:
      - package: YouTubeKit
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dylan.Setwise.Wrapper
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Wrapper-Info.plist
      properties:
        CFBundleDisplayName: TagSet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]

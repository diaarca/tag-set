name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching package.json (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Validate version tag
        run: |
          nix develop .#ci --command node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`)
            throw new Error('The tag must be v followed by the package.json version.');
          NODE
      - run: nix develop .#ci --command npm ci --no-audit
      - name: Check source
        if: runner.os == 'Linux'
        run: nix develop .#ci --command npm run check
      - name: Build Windows and Linux packages
        if: runner.os == 'Linux'
        run: |
          nix run .#windows
          nix run .#linux
          nix run .#linux-arm64
      - name: Build macOS and iOS packages
        if: runner.os == 'macOS'
        run: |
          nix run .#dmg
          nix run .#ios
          /usr/bin/ditto -c -k --keepParent "dist/releases/TagSet-${RELEASE_TAG#v}-ios.xcarchive" "dist/releases/TagSet-${RELEASE_TAG#v}-ios.xcarchive.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: |
            dist/releases/*.dmg
            dist/releases/*-setup.exe
            dist/releases/*.tar.gz
            dist/releases/*.xcarchive.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Verify packages and create draft
        working-directory: packages
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${RELEASE_TAG#v}
          files=(
            "TagSet-$version-arm64.dmg"
            "TagSet-$version-windows-x64-setup.exe"
            "TagSet-$version-linux-x64.tar.gz"
            "TagSet-$version-linux-arm64.tar.gz"
            "TagSet-$version-ios.xcarchive.zip"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download the package matching your device:

          - macOS Apple Silicon: open the DMG and drag TagSet into Applications.
          - Windows x64: run the setup installer.
          - Linux x64 / ARM64: extract the archive and run `./TagSet/tagset`. Desktop libraries and Chromium sandbox support are required.
          - iOS: the ZIP contains an unsigned Xcode archive, not a directly installable app. Use the source code and Xcode with your own Apple team to sign and install on your iPhone/iPad; see the README's iPhone and iPad instructions. No IPA is provided.

          Desktop builds are not distribution-signed or notarized and may trigger OS security prompts. Windows/Linux runtime behavior still needs device testing. Android and Intel Mac packages are not available.

          `SHA256SUMS.txt` contains SHA-256 checksums for these five packages.
          NOTES
          gh release create "$RELEASE_TAG" "${files[@]}" SHA256SUMS.txt \
            --verify-tag --draft --title "TagSet $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
